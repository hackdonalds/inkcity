<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inkcity — style prototype</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.3 Georgia, serif; color: #2b231f; }
    canvas { display: block; }
    #ui { position: fixed; top: 12px; left: 12px; background: rgba(250, 246, 238, .82); border: 1px solid #2b231f55;
      padding: 10px 12px; border-radius: 4px; display: grid; grid-template-columns: auto 140px; gap: 6px 10px; align-items: center; }
    #ui h1 { grid-column: 1 / -1; font-size: 15px; margin: 0 0 4px; font-style: italic; }
    #ui input[type=range], #ui select, #ui input[type=number] { width: 100%; box-sizing: border-box; }
    #ui .row { grid-column: 1 / -1; display: flex; gap: 6px; }
    #stats { grid-column: 1 / -1; opacity: .6; font-size: 11px; }
    #refstrip { position: fixed; right: 12px; top: 12px; bottom: 12px; display: none; flex-direction: column; gap: 8px; }
    #refstrip img { height: calc((100vh - 40px) / 3); border: 1px solid #0004; }
    body.show-refs #refstrip { display: flex; }
    #tools { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center;
      background: rgba(250, 246, 238, .88); border: 1px solid #2b231f66; border-radius: 4px; padding: 6px 8px; box-shadow: 2px 3px 0 #2b231f22; }
    #tools button { font: 14px Georgia, serif; background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 5px 10px; cursor: pointer; color: #2b231f; }
    #tools button:hover { border-color: #2b231f44; }
    #tools button.on { border-color: #2b231f; background: #2b231f12; font-style: italic; }
    #tools .sep { width: 1px; height: 22px; background: #2b231f44; margin: 0 4px; }
    #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font-style: italic; opacity: .75; white-space: nowrap; font-size: 12px; }
    #tip { position: fixed; left: 0; top: 0; pointer-events: none; display: none; background: rgba(250, 246, 238, .9); border: 1px solid #2b231f55;
      padding: 3px 7px; border-radius: 3px; font-size: 12px; white-space: nowrap; }
    #toast { position: fixed; left: 50%; top: 18px; transform: translate(-50%, -8px); opacity: 0; transition: .2s; background: #2b231f; color: #f4ede0;
      padding: 7px 14px; border-radius: 3px; pointer-events: none; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 640px) { #ui { display: none; } #hint { display: none; } #tools { bottom: 12px; } }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Inkcity · settlement study</h1>
    <label>Seed</label><input id="seed" type="number" />
    <label>Main tower</label><input id="height" type="range" min="8" max="40" step="1" />
    <label>Buildings</label><input id="count" type="range" min="1" max="14" step="1" />
    <label>Lean</label><input id="lean" type="range" min="0" max="2.5" step="0.05" />
    <label>Wonkiness</label><input id="wonk" type="range" min="0" max="1.5" step="0.05" />
    <label>Site</label><select id="terrain"><option value="crag">Crag</option><option value="island">Sea island</option><option value="hilltop">Hilltop</option></select>
    <label>Palette</label><select id="palette"></select>
    <label>Line weight</label><input id="line" type="range" min="0.5" max="2.5" step="0.05" />
    <label>Boiling lines</label><input id="boil" type="checkbox" />
    <label>Hatching</label><input id="hatch" type="checkbox" />
    <div class="row"><button id="dice">Generate town</button><button id="empty">Empty site</button><button id="refs">Refs</button></div>
    <div id="stats"></div>
  </div>
  <div id="tools">
    <button data-tool="look" title="Look (1)">👁 Look</button>
    <button data-tool="build" title="Build (2)">⌂ Build</button>
    <button data-tool="bridge" title="Bridge (3)">⌒ Bridge</button>
    <button data-tool="demolish" title="Demolish (4)">✕ Demolish</button>
    <span class="sep"></span>
    <button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
  </div>
  <div id="hint"></div>
  <div id="tip"></div>
  <div id="toast"></div>
  <div id="refstrip"><img src="refs/1.webp" /><img src="refs/2.webp" /><img src="refs/3.webp" /></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
